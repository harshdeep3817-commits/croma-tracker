name: 24/7 High-Speed Croma Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Backup trigger every 6 hours

permissions:
  actions: write
  contents: read

concurrency:
  group: croma-high-speed-tracker
  cancel-in-progress: false

jobs:
  monitor-croma:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Continuous 60-Second Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python croma_tracker.py

      - name: Automatically Restart Next Session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run tracker.yml
